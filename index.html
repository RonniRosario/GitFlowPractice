<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Simple and responsive product CRUD management system for Git Flow practice.">
  <title>StockFlow - Product Management</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Custom Styles -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-light py-3">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="#">
        <i class="bi bi-box-seam me-2"></i>
        <span>StockFlow</span>
      </a>
      <button class="btn btn-primary d-flex align-items-center" id="btn-add-product" data-bs-toggle="modal" data-bs-target="#productModal">
        <i class="bi bi-plus-lg me-1"></i>
        <span>Add Product</span>
      </button>
    </div>
  </nav>

  <!-- Main Container -->
  <main class="container my-5">
    <div class="row">
      <div class="col-12">
        
        <!-- Toast-like notifications are dynamically injected into #alert-container -->
        <div id="alert-container" aria-live="polite" aria-atomic="true"></div>

        <!-- Product Search -->
        <div class="mb-4">
          <div class="input-group search-group">
            <span class="input-group-text search-icon-container">
              <i class="bi bi-search"></i>
            </span>
            <input type="text" class="form-control" id="search-input" placeholder="Search products by name...">
          </div>
        </div>

        <!-- Product Table Card -->
        <div class="card">
          <div class="card-body p-0">
            <div class="table-responsive">
              <table class="table align-middle">
                <thead>
                  <tr>
                    <th scope="col" style="width: 40%">Product Name</th>
                    <th scope="col" style="width: 25%">Category</th>
                    <th scope="col" style="width: 20%">Price</th>
                    <th scope="col" style="width: 15%" class="text-end">Actions</th>
                  </tr>
                </thead>
                <tbody id="product-table-body">
                  <!-- Product items will be dynamically loaded here by script.js -->
                </tbody>
              </table>
            </div>

            <!-- Empty State -->
            <div id="empty-state" class="empty-state d-none">
              <i class="bi bi-folder2-open empty-state-icon"></i>
              <h5>No products found</h5>
              <p class="text-muted mb-0">Get started by creating your first product using the "Add Product" button above.</p>
            </div>

          </div>
        </div>

      </div>
    </div>
  </main>

  <!-- Product Add/Edit Modal -->
  <div class="modal fade" id="productModal" tabindex="-1" aria-labelledby="productModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="productModalLabel">Add Product</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" id="btn-modal-close"></button>
        </div>
        <form id="productForm" novalidate>
          <div class="modal-body">
            <!-- Hidden field to track editing ID -->
            <input type="hidden" id="productId">

            <!-- Product Name -->
            <div class="mb-3">
              <label for="productName" class="form-label">Product Name</label>
              <input type="text" class="form-control" id="productName" placeholder="Enter product name" required>
              <div class="invalid-feedback">Please enter a valid product name.</div>
            </div>

            <!-- Product Category -->
            <div class="mb-3">
              <label for="productCategory" class="form-label">Category</label>
              <select class="form-select" id="productCategory" required>
                <option value="" disabled selected>Select category...</option>
                <option value="Electronics">Electronics</option>
                <option value="Clothing">Clothing</option>
                <option value="Home & Kitchen">Home & Kitchen</option>
                <option value="Books">Books</option>
                <option value="Beauty & Personal Care">Beauty & Personal Care</option>
                <option value="Sports & Outdoors">Sports & Outdoors</option>
              </select>
              <div class="invalid-feedback">Please select a category.</div>
            </div>

            <!-- Product Price -->
            <div class="mb-3">
              <label for="productPrice" class="form-label">Price ($)</label>
              <input type="number" class="form-control" id="productPrice" placeholder="0.00" min="0.01" step="0.01" required>
              <div class="invalid-feedback">Please enter a price greater than 0.</div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary" id="btn-save-product">Save Product</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <!-- Custom Script -->
  <script src="script.js"></script>
</body>
</html>
