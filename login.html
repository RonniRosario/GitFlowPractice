<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Login to StockFlow Product Management System.">
  <title>StockFlow - Login</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Custom Styles (matching StockFlow branding) -->
  <link rel="stylesheet" href="styles.css">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 py-4">

  <div class="container d-flex justify-content-center">
    <!-- Card container with custom top-border highlighting the StockFlow primary color -->
    <div class="card w-100" style="max-width: 420px; border-top: 4px solid var(--primary-color);">
      <div class="card-body p-4 p-md-5">
        
        <!-- Logo and Brand Name -->
        <div class="text-center mb-4">
          <!-- Circular icon container matching StockFlow primary indigo color -->
          <div class="d-inline-flex align-items-center justify-content-center rounded-circle mb-3" 
               style="width: 60px; height: 60px; background-color: rgba(79, 70, 229, 0.1); color: var(--primary-color);">
            <i class="bi bi-box-seam fs-2"></i>
          </div>
          <h2 class="fw-bold text-dark mb-1">StockFlow</h2>
          <p class="text-muted small">Sign in to manage your inventory</p>
        </div>

        <!-- Alert placeholder for login validation errors (Required for Selenium testing) -->
        <div id="login-alert"></div>

        <!-- Login Form -->
        <form id="loginForm" novalidate>
          <!-- Username Input -->
          <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input type="text" class="form-control" id="username" placeholder="Enter username" required autocomplete="username">
          </div>

          <!-- Password Input -->
          <div class="mb-4">
            <label for="password" class="form-label">Password</label>
            <div class="position-relative">
              <input type="password" class="form-control pe-5" id="password" placeholder="Enter password" required autocomplete="current-password">
              <!-- Premium eye-toggle for password visibility -->
              <button type="button" class="btn position-absolute end-0 top-50 translate-middle-y border-0 bg-transparent text-muted" id="toggle-password" tabindex="-1">
                <i class="bi bi-eye" id="toggle-password-icon"></i>
              </button>
            </div>
          </div>

          <!-- Log In Button -->
          <button type="submit" class="btn btn-primary w-100 py-2 fs-6" id="btn-login">Log In</button>
        </form>
      </div>
    </div>
  </div>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

  <!-- Authentication and UI Interactions Logic -->
  <script>
    // Password toggle visibility function
    const passwordInput = document.getElementById('password');
    const togglePasswordBtn = document.getElementById('toggle-password');
    const togglePasswordIcon = document.getElementById('toggle-password-icon');

    togglePasswordBtn.addEventListener('click', function() {
      const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordInput.setAttribute('type', type);
      
      // Update toggle icon style
      if (type === 'password') {
        togglePasswordIcon.className = 'bi bi-eye';
      } else {
        togglePasswordIcon.className = 'bi bi-eye-slash';
      }
    });

    // Form Submission Local Authentication Simulation
    const loginForm = document.getElementById('loginForm');
    const usernameInput = document.getElementById('username');
    const alertContainer = document.getElementById('login-alert');

    loginForm.addEventListener('submit', function(event) {
      event.preventDefault();
      
      const usernameValue = usernameInput.value.trim();
      const passwordValue = passwordInput.value.trim();
      
      // Reset any previous alert messages
      alertContainer.innerHTML = '';
      
      // Local credentials validation check
      if (usernameValue === 'admin' && passwordValue === 'admin123') {
        // Redirect to main index page on success
        window.location.href = 'index.html';
      } else {
        // Inject error message using Bootstrap Alert component on failure
        const alertDiv = document.createElement('div');
        alertDiv.className = 'alert alert-danger alert-dismissible fade show w-100 mb-3';
        alertDiv.setAttribute('role', 'alert');
        alertDiv.innerHTML = `
          <i class="bi bi-exclamation-triangle-fill fs-5"></i>
          <div class="flex-grow-1">Incorrect username or password.</div>
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        `;
        alertContainer.appendChild(alertDiv);
      }
    });
  </script>
</body>
</html>
